name: test
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: for f in boot.js sprites.js lib.js main.js game.js worker.js legacy-redirect/index.js; do node --check "$f"; done
      - run: node --test tests/
